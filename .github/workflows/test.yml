name: Test and package

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build generated files
        run: node build.mjs
      - name: Plugin - API choices
        run: node --test --test-name-pattern='built plugin advertises API v5 and exact calibration choices' test/plugin.test.mjs
      - name: Plugin - storage init
        run: node --test --test-name-pattern='v2 storage starts empty instead of importing old calibration semantics' test/plugin.test.mjs
      - name: Plugin - library endpoint
        run: node --test --test-name-pattern='library endpoint saves valid incomplete libraries independently of setup validation' test/plugin.test.mjs
      - name: Plugin - fresh install
        run: node --test --test-name-pattern='fresh installs expose configuration requirements and All targets' test/plugin.test.mjs
      - name: Plugin - calculate
        run: node --test --test-name-pattern='calculate returns the chosen calibration flow, target and duration' test/plugin.test.mjs
      - name: Plugin - validation reload
        run: node --test --test-name-pattern='configuration validation is read-only and reload replaces setup settings' test/plugin.test.mjs
      - name: Plugin - endpoint failures
        run: node --test --test-name-pattern='disabled, wrong-method and unknown endpoints are explicit failures' test/plugin.test.mjs
      - name: Plugin - settings UI
        run: node --test --test-name-pattern='settings UI is self-contained and credits Damian in Instructions' test/plugin.test.mjs
      - name: Plugin - pitchers
        run: node --test --test-name-pattern='status advertises only configured pitcher choices and Auto is opt-in' test/plugin.test.mjs
      - name: Plugin - interpolation reload
        run: node --test --test-name-pattern='interpolation status and calculations survive serialization and reload' test/plugin.test.mjs
      - name: Check generated files
        run: git diff --exit-code -- manifest.json plugin.js
      - name: Package plugin
        run: |
          mkdir -p dist
          zip -j dist/calibrated-steam.reaplugin.zip manifest.json plugin.js LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: calibrated-steam-plugin
          path: dist/calibrated-steam.reaplugin.zip
          if-no-files-found: error
