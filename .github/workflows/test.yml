name: Test and package

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build generated files
        run: node build.mjs
      - name: Test calibration runtime
        run: node --test test/calibration-runtime.test.mjs
      - name: Test calibration session
        run: node --test test/calibration-session.test.mjs
      - name: Test calibration storage
        run: node --test test/calibration-storage.test.mjs
      - name: Test core
        run: node --test test/core.test.mjs
      - name: Test flow calibration
        run: node --test test/flow-calibration.test.mjs
      - name: Test navigation
        run: node --test test/navigation.test.mjs
      - name: Test package contract
        run: node --test test/package-contract.test.mjs
      - name: Test plugin
        run: node --test test/plugin.test.mjs
      - name: Test settings page
        run: node --test test/settings-page.test.mjs
      - name: Check generated files
        run: git diff --exit-code -- manifest.json plugin.js
      - name: Package plugin
        run: |
          mkdir -p dist
          zip -j dist/calibrated-steam.reaplugin.zip manifest.json plugin.js LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: calibrated-steam-plugin
          path: dist/calibrated-steam.reaplugin.zip
          if-no-files-found: error
