name: Test and package

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test plugin
        run: npm test
      - name: Check generated files
        run: git diff --exit-code -- manifest.json plugin.js
      - name: Package plugin
        run: |
          mkdir -p dist
          zip -j dist/calibrated-steam.reaplugin.zip manifest.json plugin.js LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: calibrated-steam-plugin
          path: dist/calibrated-steam.reaplugin.zip
          if-no-files-found: error
