name: Test and package

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test plugin
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Test failure output'
              echo '\`\`\`text'
              tail -n 160 /tmp/test-output.log
              echo '\`\`\`'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Check generated files
        run: git diff --exit-code -- manifest.json plugin.js
      - name: Package plugin
        run: |
          mkdir -p dist
          zip -j dist/calibrated-steam.reaplugin.zip manifest.json plugin.js LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: calibrated-steam-plugin
          path: dist/calibrated-steam.reaplugin.zip
          if-no-files-found: error
